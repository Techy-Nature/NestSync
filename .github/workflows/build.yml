name: Build

# Every push and pull request builds all three versions:
#   - Android:  NestSync.apk
#   - Linux:    NestSync-x86_64.AppImage
#   - macOS:    NestSync-mac-AppleSilicon.dmg and NestSync-mac-Intel.dmg
# On main, the last job publishes all of them together as one release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use private signing key if one is set up (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.NESTSYNC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nestsync.keystore"
            echo "NESTSYNC_KEYSTORE_FILE=$RUNNER_TEMP/nestsync.keystore" >> "$GITHUB_ENV"
            echo "Using the private key from repository secrets."
          else
            echo "No private key set; using the bundled public key."
          fi

      - name: Run sync tests
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        env:
          NESTSYNC_KEYSTORE_PASSWORD: ${{ secrets.NESTSYNC_KEYSTORE_PASSWORD }}
          NESTSYNC_KEY_ALIAS: ${{ secrets.NESTSYNC_KEY_ALIAS }}
          NESTSYNC_KEY_PASSWORD: ${{ secrets.NESTSYNC_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk NestSync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NestSync-apk
          path: NestSync.apk

  linux:
    name: Linux AppImage
    # An older Ubuntu, so the AppImage also runs on older Linux systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app folder
        run: ./gradlew --no-daemon :desktop:createDistributable

      - name: Pack it into an AppImage
        run: desktop/packaging/linux/build-appimage.sh

      - name: Self-test (a real sync and an HTTPS check, no window)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./NestSync-x86_64.AppImage --self-test

      - name: Open the window for 15 seconds on a virtual screen
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set +e
          xvfb-run -a timeout 15 ./NestSync-x86_64.AppImage
          code=$?
          # 124 means it was still running when the timer stopped it, which is what we want.
          if [ "$code" -ne 124 ]; then
            echo "NestSync closed early (exit code $code)."
            exit 1
          fi
          echo "NestSync started and kept running."

      - uses: actions/upload-artifact@v4
        with:
          name: NestSync-linux
          path: NestSync-x86_64.AppImage

  macos:
    name: macOS (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: AppleSilicon
          - runner: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: ./gradlew --no-daemon :desktop:createDistributable

      - name: Self-test (a real sync and an HTTPS check, no window)
        run: desktop/build/compose/binaries/main/app/NestSync.app/Contents/MacOS/NestSync --self-test

      - name: Open the window for 15 seconds
        run: |
          desktop/build/compose/binaries/main/app/NestSync.app/Contents/MacOS/NestSync &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "NestSync started and kept running."
            kill "$pid"
          else
            code=0
            wait "$pid" || code=$?
            echo "NestSync closed early (exit code $code)."
            exit 1
          fi

      - name: Sign ad-hoc and make the DMG (app + "Open NestSync" helper + Applications shortcut)
        run: desktop/packaging/macos/make-dmg.sh "NestSync-mac-${{ matrix.label }}.dmg"

      - name: Check the DMG
        run: |
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "NestSync-mac-${{ matrix.label }}.dmg"
          ls -la "$mnt"
          test -x "$mnt/Open NestSync.command"
          test -L "$mnt/Applications"
          codesign --verify --deep --strict --verbose=2 "$mnt/NestSync.app"
          codesign -dv "$mnt/NestSync.app" 2>&1 | grep -E "Signature=adhoc|Identifier="
          "$mnt/NestSync.app/Contents/MacOS/NestSync" --self-test
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: NestSync-mac-${{ matrix.label }}
          path: NestSync-mac-${{ matrix.label }}.dmg

  release:
    name: Publish release (main branch only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NestSync 1.0.${{ github.run_number }}
          body: |
            **Android:** tap **NestSync.apk** below on your phone, then open it to install or update.

            **Linux:** download **NestSync-x86_64.AppImage**, make it executable, and open it.

            **Mac:** download **NestSync-mac-AppleSilicon.dmg** (M1 and newer) or **NestSync-mac-Intel.dmg** (older Macs), open it and drag **NestSync** into **Applications**. The app isn't signed with a paid Apple Developer ID, so the first time, double-click **Open NestSync** in the DMG (or paste one Terminal command). The README has both ways, step by step.

            Full steps are in the [README](https://github.com/Techy-Nature/NestSync#readme).
          files: |
            dist/NestSync.apk
            dist/NestSync-x86_64.AppImage
            dist/NestSync-mac-AppleSilicon.dmg
            dist/NestSync-mac-Intel.dmg
          make_latest: "true"
