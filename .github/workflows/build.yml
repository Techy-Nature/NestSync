name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use private signing key if one is set up (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.NESTSYNC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nestsync.keystore"
            echo "NESTSYNC_KEYSTORE_FILE=$RUNNER_TEMP/nestsync.keystore" >> "$GITHUB_ENV"
            echo "Using the private key from repository secrets."
          else
            echo "No private key set; using the bundled public key."
          fi

      - name: Run sync tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APK
        env:
          NESTSYNC_KEYSTORE_PASSWORD: ${{ secrets.NESTSYNC_KEYSTORE_PASSWORD }}
          NESTSYNC_KEY_ALIAS: ${{ secrets.NESTSYNC_KEY_ALIAS }}
          NESTSYNC_KEY_PASSWORD: ${{ secrets.NESTSYNC_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk NestSync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NestSync-apk
          path: NestSync.apk

      - name: Publish release (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NestSync 1.0.${{ github.run_number }}
          body: |
            Tap **NestSync.apk** below to download it on your phone, then open it to install or update.
          files: NestSync.apk
          make_latest: "true"
